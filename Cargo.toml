[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/macros",
    "crates/musicxml",
    "crates/species-counterpoint",
    "crates/debug-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/anomalyco/passacaglia-rs"

[workspace.dependencies]
num-rational = "0.4"
num-traits = "0.2"
proc-macro2 = "1"
quote = "1"
syn = "2"
quick-xml = "0.42"

passacaglia-common = { path = "crates/common" }
passacaglia-core = { path = "crates/core" }
passacaglia-macros = { path = "crates/macros" }
passacaglia-musicxml = { path = "crates/musicxml" }
passacaglia-species-counterpoint = { path = "crates/species-counterpoint" }

