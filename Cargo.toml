[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/anomalyco/passacaglia-rs"

[workspace.dependencies]
num-rational = "0.4"
num-traits = "0.2"
proc-macro2 = "1"
quote = "1"
syn = "2"

passacaglia-common = { path = "crates/common" }
passacaglia-core = { path = "crates/core" }
passacaglia-macros = { path = "crates/macros" }

# Musical values in this engine are tiny (degrees <= 7, pitch classes <= 12,
# small periods/octaves), so the `as` casts between usize/i64/u64/i32/f64 are
# always in range and lossless in practice. We pin these pedantic cast lints to
# `allow` (rather than scattering `try_from().unwrap()` everywhere) so the IDE
# and `cargo clippy` agree. The remaining pedantic lints (`must_use`, lossless
# `From` casts, etc.) are addressed in code.
[workspace.lints.clippy]
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
must_use_candidate = "allow"

